<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="Nm">Nome: <input type="text" name="Nome" id="Nm" required minlength="5" maxlength="15" placeholder="Digite seu nome" autocomplete="username"></label>
        </p>
        <p>
            <label for="Sen">Senha: <input type="password" name="Senha" id="Sen" required minlength="7" placeholder="Digite sua senha" autocomplete="current-password"></label>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
