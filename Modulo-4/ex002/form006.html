<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="get" autocomplete="on">
        <fieldset style="border-color: black;">
            <legend>Mais exemplos</legend>

            <label for="Cor">Cor:</label>
            <input type="color" name="nCor" id="Cor">

            <p>
                <label for="inivel">Nível de Satisfação</label>
                <input type="range" name="nnivel" id="inivel">
            </p>

            <p>
                <label for="ifile">Foto:</label>
                <input type="file" name="nfoto" id="ifile">
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
