<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="get">
        <p>
            <label for="Nm">Nome</label>
            <input type="text" name="Nome" id="Nm" required minlength="30" placeholder="Nome completo" autocomplete="username">
        </p>
        <p>
            <label for="Md">Média</label>
            <input type="number" name="media" id="Md" min="0" max="10" placeholder="0 a 10" step="0.5" value="5" required>
        </p>
        <p>
            <label for="Mes">Periodo Letivo</label>
            <input type="month" name="mes" id="Mes" value="2026-03">
        </p>
        <p>
            <label for="Prova">Dia da prova</label>
            <input type="date" name="dia" id="Prova" value="2020-07-14">
        </p>
        <p>
            <label for="Hora">Hora da prova</label>
            <input type="time" name="hora" id="Hora">
        </p>
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>
</html>
