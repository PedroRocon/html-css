<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<form action="">
    <p>
        <input type="range" name="Nota" id="inota" value="5" max="10" oninput="nota.innerHTML = Number (inota.value)">
        <output id="nota">5</output>

    </p>

    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>


</form>
</body>
</html>
